<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Как добраться — Крона Парк</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f0; display: flex; justify-content: center; min-height: 100vh; }
    .infographic-wrap {
      position: relative;
      max-width: 480px;
      width: 100%;

      position: absolute;

      top: 65.5%;
      width: 44%;
      height: 8%;
      display: block;
      cursor: pointer;
    }
    .map-link-cloud {
      position: absolute;
      left: 51%;

      width: 44%;
      height: 8%;
      display: block;
      cursor: pointer;
    }

</head>
<body>
  <div class="infographic-wrap">
    <img src="assets/kak-dobratsya.png" alt="Как добраться на презентацию участка Крона Парк">
    <a class="map-link"
       href="https://yandex.com/maps/-/CPR3jQKF"
       target="_blank"
       rel="noopener"
       title="Открыть маршрут в Яндекс.Картах">
    </a>
    <a class="map-link-cloud"
       href="https://yandex.com/maps/-/CPR3jQKF"
       target="_blank"

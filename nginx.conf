server {
    listen 80;
    listen [::]:80;
    server_name krona-park.ru www.krona-park.ru;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name krona-park.ru www.krona-park.ru;

    root /var/www/krona-park;
    index index.html;

    # SSL — замените на свои пути (или используйте certbot)
    ssl_certificate     /etc/letsencrypt/live/krona-park.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krona-park.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip-сжатие
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Кэширование статики
    location ~* \.(png|webp|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Основной маршрут
    location / {
        try_files $uri $uri/ =404;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
